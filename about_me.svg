<svg width="800" height="470" viewBox="0 0 800 470" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <!-- Glow Filter -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
        
        <!-- 3D Shadow Filter -->
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="4" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.8"/>
        </filter>

        <!-- Glassmorphism Gradient -->
        <linearGradient id="card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0a0f1a" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#05080f" stop-opacity="0.9"/>
        </linearGradient>

        <!-- Neon Border Gradient -->
        <linearGradient id="neon_border" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00f2ff"/>
            <stop offset="50%" stop-color="#0077ff"/>
            <stop offset="100%" stop-color="#00f2ff"/>
        </linearGradient>
    </defs>

    <!-- No background rect to allow seamless integration with GitHub's theme -->

    <!-- Content Rows -->
    
    <!-- Card 1 -->
    <g transform="translate(20, 20)">
        <!-- Neumorphic/3D Shadow -->
        <rect x="4" y="4" width="760" height="100" rx="12" fill="#000" fill-opacity="0.4" />
        
        <!-- Main Card Body (Glassmorphism) -->
        <rect width="760" height="100" rx="12" fill="url(#card_bg)" stroke="url(#neon_border)" stroke-width="1.5" />
        
        <!-- Left Accent Bar -->
        <rect width="4" height="100" rx="2" fill="url(#neon_border)" filter="url(#glow)" />

        <!-- Icon Section -->
        <circle cx="40" cy="50.0" r="20" fill="#161b22" stroke="#30363d" />
        <text x="40" y="58.0" text-anchor="middle" font-size="20">🔐</text>
        
        <!-- Label -->
        <text x="75" y="55.0" fill="#00f2ff" font-family="monospace" font-size="14" font-weight="bold" style="filter: url(#glow);">PROFESSION:</text>
        
        <!-- Content -->
        <text x="175" y="45.0" fill="#e6edf3" font-family="monospace" font-size="14" font-weight="400">Security Researcher | Cyber Threat Analysis | Open Source Tools | Founder</text><text x="175" y="65.0" fill="#e6edf3" font-family="monospace" font-size="14" font-weight="400">@PremLabs Security Lab</text>
        
        <!-- Decorative Cyber Grid Corner -->
        <path d="M 740 10 L 750 10 L 750 20" stroke="#00f2ff" stroke-width="1" fill="none" opacity="0.5" />
    </g>
    
    <!-- Card 2 -->
    <g transform="translate(20, 130)">
        <!-- Neumorphic/3D Shadow -->
        <rect x="4" y="4" width="760" height="70" rx="12" fill="#000" fill-opacity="0.4" />
        
        <!-- Main Card Body (Glassmorphism) -->
        <rect width="760" height="70" rx="12" fill="url(#card_bg)" stroke="url(#neon_border)" stroke-width="1" />
        
        <!-- Left Accent Bar -->
        <rect width="4" height="70" rx="2" fill="url(#neon_border)" filter="url(#glow)" />

        <!-- Icon Section -->
        <circle cx="40" cy="35.0" r="20" fill="#161b22" stroke="#30363d" />
        <text x="40" y="43.0" text-anchor="middle" font-size="20">🐧</text>
        
        <!-- Label -->
        <text x="75" y="40.0" fill="#00f2ff" font-family="monospace" font-size="14" font-weight="bold" style="filter: url(#glow);">LINUX:</text>
        
        <!-- Content -->
        <text x="175" y="40.0" fill="#e6edf3" font-family="monospace" font-size="14" font-weight="400">Developer & Power User</text>
        
        <!-- Decorative Cyber Grid Corner -->
        <path d="M 740 10 L 750 10 L 750 20" stroke="#00f2ff" stroke-width="1" fill="none" opacity="0.5" />
    </g>
    
    <!-- Card 3 -->
    <g transform="translate(20, 210)">
        <!-- Neumorphic/3D Shadow -->
        <rect x="4" y="4" width="760" height="70" rx="12" fill="#000" fill-opacity="0.4" />
        
        <!-- Main Card Body (Glassmorphism) -->
        <rect width="760" height="70" rx="12" fill="url(#card_bg)" stroke="url(#neon_border)" stroke-width="1" />
        
        <!-- Left Accent Bar -->
        <rect width="4" height="70" rx="2" fill="url(#neon_border)" filter="url(#glow)" />

        <!-- Icon Section -->
        <circle cx="40" cy="35.0" r="20" fill="#161b22" stroke="#30363d" />
        <text x="40" y="43.0" text-anchor="middle" font-size="20">🤖</text>
        
        <!-- Label -->
        <text x="75" y="40.0" fill="#00f2ff" font-family="monospace" font-size="14" font-weight="bold" style="filter: url(#glow);">FOCUS:</text>
        
        <!-- Content -->
        <text x="175" y="40.0" fill="#e6edf3" font-family="monospace" font-size="14" font-weight="400">Security Research & LLM Behavior Analysis</text>
        
        <!-- Decorative Cyber Grid Corner -->
        <path d="M 740 10 L 750 10 L 750 20" stroke="#00f2ff" stroke-width="1" fill="none" opacity="0.5" />
    </g>
    
    <!-- Card 4 -->
    <g transform="translate(20, 290)">
        <!-- Neumorphic/3D Shadow -->
        <rect x="4" y="4" width="760" height="70" rx="12" fill="#000" fill-opacity="0.4" />
        
        <!-- Main Card Body (Glassmorphism) -->
        <rect width="760" height="70" rx="12" fill="url(#card_bg)" stroke="url(#neon_border)" stroke-width="1" />
        
        <!-- Left Accent Bar -->
        <rect width="4" height="70" rx="2" fill="url(#neon_border)" filter="url(#glow)" />

        <!-- Icon Section -->
        <circle cx="40" cy="35.0" r="20" fill="#161b22" stroke="#30363d" />
        <text x="40" y="43.0" text-anchor="middle" font-size="20">🌐</text>
        
        <!-- Label -->
        <text x="75" y="40.0" fill="#00f2ff" font-family="monospace" font-size="14" font-weight="bold" style="filter: url(#glow);">GOOGLE:</text>
        
        <!-- Content -->
        <text x="175" y="40.0" fill="#e6edf3" font-family="monospace" font-size="14" font-weight="400">Google for Developers member</text>
        
        <!-- Decorative Cyber Grid Corner -->
        <path d="M 740 10 L 750 10 L 750 20" stroke="#00f2ff" stroke-width="1" fill="none" opacity="0.5" />
    </g>
    
    <!-- Card 5 -->
    <g transform="translate(20, 370)">
        <!-- Neumorphic/3D Shadow -->
        <rect x="4" y="4" width="760" height="70" rx="12" fill="#000" fill-opacity="0.4" />
        
        <!-- Main Card Body (Glassmorphism) -->
        <rect width="760" height="70" rx="12" fill="url(#card_bg)" stroke="url(#neon_border)" stroke-width="1" />
        
        <!-- Left Accent Bar -->
        <rect width="4" height="70" rx="2" fill="url(#neon_border)" filter="url(#glow)" />

        <!-- Icon Section -->
        <circle cx="40" cy="35.0" r="20" fill="#161b22" stroke="#30363d" />
        <text x="40" y="43.0" text-anchor="middle" font-size="20">📍</text>
        
        <!-- Label -->
        <text x="75" y="40.0" fill="#00f2ff" font-family="monospace" font-size="14" font-weight="bold" style="filter: url(#glow);">LOCATION:</text>
        
        <!-- Content -->
        <text x="175" y="40.0" fill="#e6edf3" font-family="monospace" font-size="14" font-weight="400">Pune, Maharashtra, India</text>
        
        <!-- Decorative Cyber Grid Corner -->
        <path d="M 740 10 L 750 10 L 750 20" stroke="#00f2ff" stroke-width="1" fill="none" opacity="0.5" />
    </g>
    
</svg>